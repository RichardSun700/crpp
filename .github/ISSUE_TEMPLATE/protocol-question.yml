name: Protocol question
description: Discuss a scoped CRPP rule or ambiguity without sharing private context.
title: "[Protocol]: "
labels: [protocol]
body:
  - type: markdown
    attributes:
      value: Do not submit real employer, worker, customer, patient, or user context.
  - type: input
    id: rule
    attributes:
      label: Rule ID or section
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: synthetic
    attributes:
      label: Synthetic example
